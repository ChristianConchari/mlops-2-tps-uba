[project]
name = "mlops-2-tps-uba"
version = "0.1.0"
description = "Entregas de MLOps II (UBA) — Christian Conchari"
authors = [{ name = "Christian Conchari", email = "chrisconchari@gmail.com" }]
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "requests>=2.32",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "numpy>=1.26",
    "strawberry-graphql[fastapi]>=0.230",
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "grpcio>=1.83.1",
    "grpcio-tools>=1.83.1",
    "boto3>=1.43.110",
    "mlflow>=3",
    "minio>=7.2.20",
    "cryptography>=50.0.2",
    "pyjwt>=2.15.1",
    "matplotlib>=3.11.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/model_service"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
